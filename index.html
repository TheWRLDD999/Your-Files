
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Your Files</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f6f8;color:#20232a;font-family:Arial,sans-serif}
header{background:white;padding:22px 18px;border-bottom:1px solid #e8e9ed}
.logo{display:flex;align-items:center;gap:12px;font-size:21px;font-weight:700}
.icon{width:43px;height:43px;border-radius:13px;background:#edf0f5;color:#26354a;display:grid;place-items:center;font-weight:800}
main{max-width:750px;margin:auto;padding:20px 16px}
button{border:0;border-radius:12px;padding:12px 16px;background:#26354a;color:white;font-size:14px;font-weight:600}
button.secondary{background:white;color:#26354a;border:1px solid #e2e5eb}
input{width:100%;padding:14px;border:1px solid #e2e5eb;border-radius:12px;background:white;font-size:15px;margin:16px 0}
.actions{display:flex;gap:9px;flex-wrap:wrap}
.card{background:white;border:1px solid #e9ebef;border-radius:16px;padding:16px;margin-top:15px}
h2{font-size:17px;margin:0 0 12px}
.categories{display:flex;gap:8px;overflow:auto;margin:18px 0}
.category{white-space:nowrap;background:white;color:#555;border:1px solid #e5e7eb}
.category.active{background:#26354a;color:white}
.file{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #eee}
.file:last-child{border:0}
.file-icon{width:43px;height:43px;background:#f0f2f5;border-radius:12px;display:grid;place-items:center;font-size:20px}
.file-info{flex:1;min-width:0}
.file-name{font-weight:600;overflow-wrap:anywhere}
.meta{font-size:12px;color:#858b96;margin-top:4px}
.file button{padding:9px 11px;font-size:12px}
.empty{text-align:center;color:#858b96;padding:35px 10px}
footer{font-size:12px;color:#9298a2;line-height:1.6;padding:25px 3px}
</style>
</head>
<body>
<header>
<div class="logo"><div class="icon">YF</div>Your Files</div>
</header>
<main>
<div class="actions">
<button id="add">＋ Add files</button>
<button class="secondary" id="newcat">＋ Category</button>
</div>
<input id="search" placeholder="Search your files...">
<div class="card">
<h2>My storage</h2>
<div id="storage" class="meta">Checking storage...</div>
</div>
<div class="categories" id="categories"></div>
<div class="card">
<h2 id="heading">All files</h2>
<div id="filelist"><div class="empty">Your library is empty.<br>Add a file to get started.</div></div>
</div>
<footer>Your Files stores imported files locally in this browser. Export backups regularly. Clearing browser data may erase your library.</footer>
</main>
<input type="file" id="picker" multiple hidden>
<script>
const defaults=["Ringtones","Notification tones","Wallpapers","YouTube Shorts","Photos","Videos","Other files"];
let cats=[...defaults],active="All files",db;
const $=id=>document.getElementById(id);
function openDB(){return new Promise((ok,no)=>{let r=indexedDB.open("YourFilesDB",1);r.onupgradeneeded=()=>r.result.createObjectStore("files",{keyPath:"id",autoIncrement:true});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
function all(){return new Promise(ok=>{let r=db.transaction("files").objectStore("files").getAll();r.onsuccess=()=>ok(r.result)})}
function save(f){return new Promise(ok=>{let r=db.transaction("files","readwrite").objectStore("files").add(f);r.onsuccess=ok})}
function remove(id){return new Promise(ok=>{let r=db.transaction("files","readwrite").objectStore("files").delete(id);r.onsuccess=ok})}
function size(n){if(n<1024)return n+" B";if(n<1048576)return (n/1024).toFixed(1)+" KB";return (n/1048576).toFixed(1)+" MB"}
function category(f){if(f.type.startsWith("image/"))return "Photos";if(f.type.startsWith("video/"))return "Videos";return "Other files"}
function renderCats(){$("categories").innerHTML="";["All files",...cats].forEach(c=>{let b=document.createElement("button");b.className="category"+(c===active?" active":"");b.textContent=c;b.onclick=()=>{active=c;render()};$("categories").append(b)})}
async function render(){renderCats();let fs=await all(),q=$("search").value.toLowerCase();fs=fs.filter(f=>(active==="All files"||f.category===active)&&f.name.toLowerCase().includes(q));$("heading").textContent=active;$("filelist").innerHTML="";if(!fs.length)$("filelist").innerHTML='<div class="empty">No files found.</div>';fs.forEach(f=>{let row=document.createElement("div");row.className="file";let ico=document.createElement("div");ico.className="file-icon";ico.textContent=f.type.startsWith("image/")?"▧":f.type.startsWith("video/")?"▶":f.type.startsWith("audio/")?"♫":"▤";let info=document.createElement("div");info.className="file-info";let name=document.createElement("div");name.className="file-name";name.textContent=f.name;let meta=document.createElement("div");meta.className="meta";meta.textContent=f.category+" · "+size(f.size);info.append(name,meta);let down=document.createElement("button");down.textContent="Save";down.onclick=()=>{let u=URL.createObjectURL(f.blob),a=document.createElement("a");a.href=u;a.download=f.name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};let del=document.createElement("button");del.className="secondary";del.textContent="Delete";del.onclick=async()=>{if(confirm("Delete this file?")){await remove(f.id);render()}};row.append(ico,info,down,del);$("filelist").append(row)});if(navigator.storage?.estimate){let e=await navigator.storage.estimate();$("storage").textContent=size(e.usage||0)+" used · "+size(e.quota||0)+" estimated available"}}
$("add").onclick=()=>$("picker").click();
$("picker").onchange=async e=>{for(let f of e.target.files)await save({name:f.name,type:f.type,size:f.size,category:category(f),blob:f.slice(0,f.size,f.type)});e.target.value="";render()};
$("newcat").onclick=()=>{let c=prompt("Enter category name");if(c&&c.trim()&&!cats.includes(c.trim())){cats.push(c.trim());active=c.trim();render()}};
$("search").oninput=render;
(async()=>{try{db=await openDB();if(navigator.storage?.persist)await navigator.storage.persist();render()}catch(e){$("filelist").textContent="Storage could not be opened. Try Chrome."}})();
</script>
</body>
                    </html>
